<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t" font-family="Heebo, Assistant, Arial, sans-serif">
  <title id="t">איור בסגנון קומיקס: ילד יושב על האסלה עם הרגליים על שרפרף ואומר הצלחתי</title>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.6" fill="#efdccd"/>
      <circle cx="12" cy="12" r="2.6" fill="#efdccd"/>
    </pattern>
  </defs>
  <g stroke="#4a4038" stroke-linejoin="round" stroke-linecap="round">
    <!-- רקע קומיקס -->
    <rect x="6" y="6" width="628" height="468" rx="18" fill="#fbf6f0" stroke-width="6"/>
    <rect x="6" y="6" width="628" height="468" rx="18" fill="url(#dots)" stroke="none" opacity=".75"/>
    <path d="M6,410 L634,410 L634,456 Q634,474 616,474 L24,474 Q6,474 6,456 Z" fill="#e6d6c3" stroke-width="6"/>

    <!-- מיכל ההדחה -->
    <rect x="132" y="170" width="76" height="150" rx="14" fill="#ffffff" stroke-width="6"/>
    <rect x="156" y="150" width="28" height="22" rx="7" fill="#ffffff" stroke-width="5"/>
    <!-- האסלה -->
    <path d="M182,318 L352,318 Q354,366 310,390 L296,410 L222,410 L216,390 Q182,370 182,318 Z" fill="#ffffff" stroke-width="6"/>
    <rect x="174" y="304" width="190" height="18" rx="9" fill="#e8dccf" stroke-width="6"/>

    <!-- שרפרף -->
    <rect x="360" y="352" width="140" height="58" rx="12" fill="#d8a084" stroke-width="6"/>
    <line x1="380" y1="372" x2="480" y2="372" stroke-width="4" opacity=".5"/>

    <!-- ירך -->
    <path d="M250,262 L372,240 Q396,240 398,262 Q398,284 376,290 L262,306 Q236,306 236,284 Q236,266 250,262 Z" fill="#6f8f7c" stroke-width="6"/>
    <!-- שוק -->
    <path d="M370,276 L398,276 L410,340 L380,344 Z" fill="#f7cfae" stroke-width="6"/>
    <!-- נעל -->
    <path d="M372,338 Q408,326 444,340 Q458,352 444,354 L374,354 Q362,348 372,338 Z" fill="#a8603f" stroke-width="6"/>

    <!-- גוף -->
    <path d="M232,300 C222,240 236,190 280,172 C316,158 340,184 334,230 C330,264 320,292 304,302 Z" fill="#a9bfa6" stroke-width="6"/>
    <!-- זרוע שנחה על הברך -->
    <path d="M306,206 Q340,228 364,244" fill="none" stroke-width="22"/>
    <path d="M306,206 Q340,228 364,244" fill="none" stroke="#a9bfa6" stroke-width="12"/>
    <circle cx="374" cy="248" r="15" fill="#f7cfae" stroke-width="5"/>

    <!-- ראש -->
    <circle cx="300" cy="128" r="46" fill="#f7cfae" stroke-width="6"/>
    <path d="M256,124 C252,82 290,68 318,78 C342,86 350,104 346,120 C334,106 314,102 296,106 C280,110 266,116 256,124 Z" fill="#7a5a43" stroke-width="5"/>
    <circle cx="326" cy="130" r="6" fill="#4a4038" stroke="none"/>
    <circle cx="328" cy="128" r="2" fill="#ffffff" stroke="none"/>
    <path d="M312,150 Q326,164 340,150" fill="#ffffff" stroke-width="4"/>
    <ellipse cx="308" cy="144" rx="9" ry="6" fill="#d8a084" stroke="none" opacity=".7"/>

    <!-- בועת דיבור -->
    <path d="M420,60 L600,60 Q616,60 616,76 L616,140 Q616,156 600,156 L462,156 L418,190 L432,156 L420,156 Q404,156 404,140 L404,76 Q404,60 420,60 Z" fill="#ffffff" stroke-width="6"/>
  </g>
  <text x="510" y="122" text-anchor="middle" font-size="38" font-weight="800" fill="#4a4038" direction="rtl">הצלחתי!</text>
  <!-- קווי שמחה -->
  <g stroke="#4a4038" stroke-width="5" stroke-linecap="round">
    <line x1="236" y1="70" x2="222" y2="56"/>
    <line x1="228" y1="96" x2="208" y2="94"/>
    <line x1="256" y1="52" x2="252" y2="34"/>
  </g>
</svg>
