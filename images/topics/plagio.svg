<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t" font-family="Heebo, Assistant, Arial, sans-serif">
  <title id="t">איור: ראש תינוק במבט מלמעלה, צורה עגולה לעומת השטחה בצד אחד</title>
  <rect width="800" height="600" fill="#fffaf4"/>
  <circle cx="110" cy="90" r="40" fill="#e3eee7"/>
  <circle cx="700" cy="520" r="54" fill="#f6dfcf" opacity=".8"/>

  <!-- ראש עגול -->
  <g transform="translate(230,300)">
    <ellipse cx="0" cy="-118" rx="34" ry="18" fill="#f1cfb4" stroke="#d9b08f" stroke-width="3"/>
    <ellipse cx="-104" cy="0" rx="16" ry="30" fill="#f1cfb4" stroke="#d9b08f" stroke-width="3"/>
    <ellipse cx="104" cy="0" rx="16" ry="30" fill="#f1cfb4" stroke="#d9b08f" stroke-width="3"/>
    <ellipse cx="0" cy="8" rx="100" ry="124" fill="#f6d9bf" stroke="#d9b08f" stroke-width="4"/>
    <path d="M-60,-60 Q0,-100 60,-60" fill="none" stroke="#c99b78" stroke-width="3" opacity=".5"/>
    <path d="M-40,-20 Q0,-44 40,-20" fill="none" stroke="#c99b78" stroke-width="3" opacity=".4"/>
  </g>
  <!-- ראש עם השטחה -->
  <g transform="translate(570,300)">
    <ellipse cx="-10" cy="-118" rx="34" ry="18" fill="#f1cfb4" stroke="#d9b08f" stroke-width="3"/>
    <ellipse cx="-112" cy="-6" rx="16" ry="30" fill="#f1cfb4" stroke="#d9b08f" stroke-width="3"/>
    <ellipse cx="100" cy="14" rx="16" ry="30" fill="#f1cfb4" stroke="#d9b08f" stroke-width="3"/>
    <path d="M-10,-116 C60,-116 100,-60 98,10 C96,70 70,118 40,128 C10,136 -60,134 -88,104 C-112,78 -110,-10 -96,-56 C-80,-100 -50,-116 -10,-116 Z" fill="#f6d9bf" stroke="#d9b08f" stroke-width="4"/>
    <path d="M-60,-62 Q-6,-98 52,-62" fill="none" stroke="#c99b78" stroke-width="3" opacity=".5"/>
    <path d="M-40,-22 Q0,-44 40,-22" fill="none" stroke="#c99b78" stroke-width="3" opacity=".4"/>
    <!-- סימון האזור השטוח -->
    <path d="M-92,96 Q-60,138 20,134" fill="none" stroke="#e48c6a" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
  </g>

  <g font-size="26" font-weight="700" text-anchor="middle" direction="rtl">
    <text x="230" y="500" fill="#5d7a63">צורה עגולה</text>
    <text x="570" y="500" fill="#c4704f">השטחה בצד אחד</text>
  </g>
  <text x="400" y="60" font-size="22" text-anchor="middle" fill="#6b7468" direction="rtl">ראש התינוק במבט מלמעלה</text>
</svg>
